<script>
// コードで描くショート 試作2（Fable版）：Codexリセット券消失事件
// 全面を Canvas で描き、配信の顔カメラ（face/00001.jpg〜, 30fps）を「LIVE」枠として重ねる。
// draw(t, s, tEnd) : t = 出力動画の時刻, s = 元配信の時刻（秒）
const W = 1080, H = 1920, OFF = 2105.0, FPS = 30;
const cv = document.getElementById('c'); let g = cv.getContext('2d');
const F = '"IPAGothic","IPAPGothic",sans-serif', MONO = '"JetBrains Mono",monospace', EN = '"Inter",sans-serif';
let FACE = null;
window.loadFace = async function (s) {
  const i = Math.max(1, Math.min(1830, Math.round((s - OFF) * FPS) + 1));
  const im = new Image(); im.src = 'face/' + String(i).padStart(5, '0') + '.jpg'; await im.decode(); FACE = im;
};

const SUBS = [
 [2112.73, 2114.69, '今日一個ガチやらかしがあって'], [2114.69, 2116.59, '朝まで俺Codexで'],
 [2119.54, 2120.94, 'なんかその卒論のための'], [2120.94, 2124.16, 'いろいろ倫理申請やってたんですよ'],
 [2124.16, 2125.70, 'でCodexの利用枠が'], [2125.70, 2128.0, '残り数パーセントになっちゃって'],
 [2128.22, 2130.34, 'で10月30日まで使える'], [2131.56, 2133.40, 'リセット券残してたから'],
 [2134.26, 2135.84, 'あの朝のね'], [2135.84, 2137.22, '6時ぐらいになって'],
 [2137.22, 2140.2, 'よしそろそろ使おうかなってやったら'], [2140.58, 2142.80, 'リセット券なくなってて'],
 [2143.04, 2143.84, 'へえって'], [2143.84, 2145.32, 'ふざけんなと思って'], [2145.32, 2148.58, 'リセット券なくなる…'],
 [2149.70, 2151.14, '今日なくなるから'], [2151.14, 2153.92, '今日に合わせていい感じに使ってったのに'],
 [2153.92, 2156.6, 'リセットできなかったんだけど'], [2157.82, 2158.92, '超びっくりした'], [2158.92, 2159.9, '超悔しい'],
 [2160.16, 2163.6, '1回1200円分ぐらいの価値あるかな'],
];

// ---------- 小道具 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const mix = (c1, c2, m) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], m)))})`;
function rnd(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(str, x, y, size, fill, o = {}) {
  g.save(); g.font = `${o.weight || ''} ${size}px ${o.font || F}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle';
  if (o.rot || o.scale) { g.translate(x, y); g.rotate(o.rot || 0); g.scale(o.scale || 1, o.scale || 1); x = 0; y = 0; }
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = o.sw || size * 0.2; g.strokeStyle = o.stroke; g.strokeText(str, x, y); }
  g.fillStyle = fill; g.fillText(str, x, y);
  if (o.bold) { g.lineJoin = 'round'; g.lineWidth = size * 0.04; g.strokeStyle = fill; g.strokeText(str, x, y); } // IPAゴシックに太字がないので線で太らせる
  g.restore();
}

// ---------- 部屋（夜→朝） ----------
const SKY = { n0: [8, 10, 32], n1: [28, 30, 78], d0: [255, 140, 96], d1: [255, 220, 150] };
function windowView(s, m) {
  const x = 150, y = 240, w = 780, h = 400;
  g.save(); rr(x, y, w, h, 18); g.clip();
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, mix(SKY.n0, SKY.d0, m)); gr.addColorStop(1, mix(SKY.n1, SKY.d1, m));
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  // 星と月
  for (let i = 0; i < 46; i++) { g.globalAlpha = (1 - m) * (.3 + .7 * Math.abs(Math.sin(s * (1 + rnd(i) * 2) + i))); g.fillStyle = '#fff'; const r = 1.5 + rnd(i + 20) * 2.5; g.beginPath(); g.arc(x + rnd(i) * w, y + rnd(i + 9) * h * .6, r, 0, 7); g.fill(); }
  g.globalAlpha = 1 - m; const mx = x + 610 + m * 200, my = y + 110 - m * 90;
  g.fillStyle = '#fbf3c4'; g.beginPath(); g.arc(mx, my, 48, 0, 7); g.fill(); g.fillStyle = mix(SKY.n0, SKY.d0, m); g.beginPath(); g.arc(mx + 22, my - 14, 44, 0, 7); g.fill();
  g.globalAlpha = 1;
  // 朝日
  if (m > 0) { const sx = x + 230, sy = y + h - 60 - out3(m) * 150; const sg = g.createRadialGradient(sx, sy, 20, sx, sy, 420);
    sg.addColorStop(0, 'rgba(255,250,210,1)'); sg.addColorStop(.12, 'rgba(255,225,120,.95)'); sg.addColorStop(1, 'rgba(255,170,90,0)'); g.globalAlpha = m; g.fillStyle = sg; g.fillRect(x, y, w, h); g.globalAlpha = 1; }
  // ビル群（2層）
  for (let L = 0; L < 2; L++) { let bx = x - 20; let i = 0;
    while (bx < x + w) { const bw = 60 + rnd(i + L * 40) * 90, bh = (L ? 120 : 190) + rnd(i * 3 + L * 17) * (L ? 150 : 170);
      g.fillStyle = L ? mix([14, 16, 40], [70, 44, 60], m) : mix([24, 27, 62], [150, 92, 96], m); g.fillRect(bx, y + h - bh, bw, bh);
      for (let r = 0; r < Math.floor(bh / 34) - 1; r++) for (let c = 0; c < Math.floor(bw / 24) - 1; c++) { const k = rnd(i * 31 + r * 7 + c * 13 + L * 5);
        const on = k > .55 && rnd(i + r + c + Math.floor(s / 4 + k * 9)) > .15; if (!on) continue; g.globalAlpha = (1 - m) * .9; g.fillStyle = k > .8 ? '#9fe3ff' : '#ffd77a'; g.fillRect(bx + 12 + c * 24, y + h - bh + 16 + r * 34, 10, 16); }
      g.globalAlpha = 1; bx += bw + 6; i++; } }
  // 朝の鳥
  if (m > .6) { g.strokeStyle = '#3a2430'; g.lineWidth = 4; g.lineCap = 'round'; for (let i = 0; i < 4; i++) { const bx = x + ((s * 60 + i * 190) % (w + 100)) - 50, by = y + 110 + i * 34 + Math.sin(s * 2 + i) * 12, f = Math.sin(s * 10 + i) * 10;
      g.beginPath(); g.moveTo(bx - 16, by - f); g.quadraticCurveTo(bx - 6, by - 8, bx, by); g.quadraticCurveTo(bx + 6, by - 8, bx + 16, by - f); g.stroke(); } }
  g.restore();
  g.strokeStyle = '#11131f'; g.lineWidth = 22; rr(x, y, w, h, 18); g.stroke(); g.lineWidth = 12; g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w / 2, y + h); g.moveTo(x, y + h * .42); g.lineTo(x + w, y + h * .42); g.stroke();
  g.fillStyle = '#11131f'; rr(x - 30, y + h, w + 60, 26, 8); g.fill();
}
function ring(cx, cy, r, v, s) {
  const red = v < .1, col = red ? '#ff4d5e' : v < .35 ? '#ffb347' : '#3ddc97';
  g.lineWidth = 22; g.strokeStyle = '#222a3f'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
  g.strokeStyle = col; g.lineCap = 'round'; g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.max(.04, v) * Math.PI * 2); g.stroke(); g.lineCap = 'butt';
  const p = red ? 1 + Math.sin(s * 14) * .06 : 1;
  text(Math.round(v * 100) + '%', cx, cy - 6, 58, col, { font: EN, weight: 800, scale: p }); text('利用枠 残り', cx, cy + 44, 22, '#93a0bd');
}
function monitor(s, usage, dlg) {
  const x = 120, y = 720, w = 840, h = 460;
  g.fillStyle = '#0a0b12'; rr(x - 22, y - 22, w + 44, h + 44, 30); g.fill();
  g.fillStyle = '#23263a'; g.fillRect(W / 2 - 40, y + h + 22, 80, 70); rr(W / 2 - 170, y + h + 84, 340, 22, 11); g.fill();
  g.save(); rr(x, y, w, h, 12); g.clip(); g.fillStyle = '#0e1424'; g.fillRect(x, y, w, h);
  // 文書ウィンドウ
  g.fillStyle = '#f3f1ea'; rr(x + 430, y + 30, 380, 250, 10); g.fill(); g.fillStyle = '#d9d5c8'; g.fillRect(x + 430, y + 30, 380, 36);
  text('倫理申請書_v7_final.docx', x + 446, y + 49, 20, '#444', { align: 'left' });
  for (let i = 0; i < 7; i++) { g.fillStyle = '#b9b4a6'; g.fillRect(x + 452, y + 86 + i * 26, 250 + rnd(i) * 90, 9); }
  // ターミナル
  g.fillStyle = '#080c16'; rr(x + 24, y + 26, 470, 410, 10); g.fill(); g.fillStyle = '#1b2236'; g.fillRect(x + 24, y + 26, 470, 34);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(x + 46 + i * 24, y + 43, 7, 0, 7); g.fill(); });
  text('codex — 卒論', x + 260, y + 43, 20, '#8a96b3');
  g.save(); g.beginPath(); g.rect(x + 24, y + 64, 470, 370); g.clip();
  const sp = usage > .05 ? 70 : 0, off = (s * sp) % 30;
  for (let i = 0; i < 15; i++) { const n = i + Math.floor(s * sp / 30), ind = (rnd(n) * 4 | 0) * 26, len = 90 + rnd(n + 9) * 250;
    g.fillStyle = ['#7aa2f7', '#9ece6a', '#e0af68', '#bb9af7', '#5e6a8a'][(rnd(n + 3) * 5) | 0]; rr(x + 44 + ind, y + 76 + i * 30 - off, len, 12, 6); g.fill(); }
  g.restore();
  // 利用枠リング
  g.fillStyle = 'rgba(16,22,40,.96)'; rr(x + 560, y + 222, 250, 220, 16); g.fill(); ring(x + 685, y + 328, 76, usage, s);
  if (dlg) dlg(x, y, w, h);
  g.restore();
  // 画面の光
  const gl = g.createRadialGradient(W / 2, y + h / 2, 100, W / 2, y + h / 2, 760); gl.addColorStop(0, 'rgba(110,150,255,.16)'); gl.addColorStop(1, 'rgba(110,150,255,0)'); g.fillStyle = gl; g.fillRect(0, 400, W, 1520);
}
function deskClock(s, hr, ringing) {
  const x = 700, y = 1330; g.save(); g.translate(x + (ringing ? Math.sin(s * 70) * 7 : 0), y);
  g.fillStyle = '#161927'; rr(0, 0, 290, 120, 20); g.fill(); g.fillStyle = '#05070c'; rr(12, 12, 266, 96, 12); g.fill();
  const hh = Math.floor(hr), mm = Math.floor((hr % 1) * 60 + 1e-6);
  text(`${hh}:${String(mm).padStart(2, '0')}`, 160, 62, 76, ringing ? '#ffcf5a' : '#69e0ff', { font: MONO, weight: 800 }); text('AM', 46, 40, 20, '#69e0ff', { font: EN, weight: 700 });
  if (ringing) { g.strokeStyle = '#ffcf5a'; g.lineWidth = 6; g.lineCap = 'round'; for (let i = 0; i < 3; i++) { const a = (s * 3 + i / 3) % 1; g.globalAlpha = 1 - a; g.beginPath(); g.arc(145, 60, 170 + a * 90, -2.3, -.85); g.stroke(); } }
  g.restore(); g.globalAlpha = 1;
}
function mug(s) {
  const x = 520, y = 1335; g.fillStyle = '#e8e2d4'; rr(x, y, 110, 120, 14); g.fill(); g.strokeStyle = '#e8e2d4'; g.lineWidth = 14; g.beginPath(); g.arc(x + 118, y + 58, 30, -1.3, 1.3); g.stroke();
  g.fillStyle = '#c0392b'; g.fillRect(x, y + 44, 110, 16);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 7; g.lineCap = 'round';
  for (let i = 0; i < 3; i++) { g.beginPath(); for (let k = 0; k <= 12; k++) { const yy = y - 12 - k * 11, xx = x + 30 + i * 26 + Math.sin(s * 2 + k * .6 + i * 2) * 9; k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke(); }
}
function keyboard(s, typing) {
  const x = 280, y = 1500; g.fillStyle = '#161927'; rr(x, y, 380, 110, 14); g.fill();
  for (let r = 0; r < 3; r++) for (let c = 0; c < 11; c++) { const lit = typing && rnd(r * 11 + c + Math.floor(s * 14)) > .86; g.fillStyle = lit ? '#8fb4ff' : '#2a3048'; rr(x + 14 + c * 32.5, y + 12 + r * 30, 26, 22, 5); g.fill(); }
}
function room(s, m, usage, hr, o = {}) {
  const wall = g.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, mix([16, 18, 40], [120, 84, 92], m)); wall.addColorStop(1, mix([10, 11, 24], [70, 52, 62], m));
  g.fillStyle = wall; g.fillRect(0, 0, W, H);
  windowView(s, m);
  // 朝の光が床に差す
  if (m > 0) { g.globalAlpha = m * .22; g.fillStyle = '#ffd98a'; g.beginPath(); g.moveTo(150, 666); g.lineTo(930, 666); g.lineTo(1080, 1300); g.lineTo(-60, 1300); g.fill(); g.globalAlpha = 1; }
  g.fillStyle = mix([34, 26, 30], [92, 62, 50], m); g.fillRect(0, 1290, W, 630); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, 1290, W, 14);
  monitor(s, usage, o.dlg); mug(s); deskClock(s, hr, o.ringing);
}

// ---------- リセット券 ----------
function ticket(cx, cy, sc, rot, s, o = {}) {
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(sc, sc);
  const w = 640, h = 290;
  const path = () => { g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 26); g.arc(-w / 2, 0, 36, 0, 7); g.arc(w / 2, 0, 36, 0, 7); };
  g.save(); g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 26); g.clip();
  const gr = g.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); gr.addColorStop(0, '#ffcf3f'); gr.addColorStop(.45, '#fff3b0'); gr.addColorStop(1, '#ffa62b'); g.fillStyle = gr; g.fillRect(-w / 2, -h / 2, w, h);
  g.strokeStyle = 'rgba(140,90,0,.5)'; g.lineWidth = 4; rr(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 16); g.stroke();
  g.setLineDash([14, 12]); g.beginPath(); g.moveTo(150, -h / 2 + 22); g.lineTo(150, h / 2 - 22); g.stroke(); g.setLineDash([]);
  text('RESET TICKET', -80, -92, 26, '#9a6500', { font: EN, weight: 800 });
  text('リセット券', -80, -22, 88, '#5a3600', { bold: 1 }); text('利用枠を 100% に回復', -80, 62, 32, '#7a4a00');
  text('期限', 222, -84, 28, '#7a4a00'); text('10/30', 218, 76, 48, '#c0392b', { font: EN, weight: 800 }); text('まで', 222, -50, 28, '#7a4a00');
  if (!o.dead) { const sh = ((s * .55) % 1.7) - .35; g.globalCompositeOperation = 'lighter'; g.save(); g.transform(1, 0, -.4, 1, 0, 0);
    const lg = g.createLinearGradient(-w / 2 + sh * w, 0, -w / 2 + sh * w + 150, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.7)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = lg; g.fillRect(-w, -h, w * 2, h * 2); g.restore(); }
  g.restore();
  g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(-w / 2, 0, 36, 0, 7); g.arc(w / 2, 0, 36, 0, 7); g.fill(); g.globalCompositeOperation = 'source-over';
  g.restore();
}
// 券のレイヤーだけ別キャンバスに描く（切り欠きと、粒になって消える処理のため）
const tc = document.createElement('canvas'); tc.width = 760; tc.height = 380; const tg = tc.getContext('2d');
function ticketLayer(s, dead) { const main = g; tg.clearRect(0, 0, 760, 380); g = tg; ticket(380, 190, 1, 0, s, { dead }); g = main; }
function drawTicket(cx, cy, sc, rot, s, dead) { ticketLayer(s, dead); g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(sc, sc); g.drawImage(tc, -380, -190); g.restore(); }

function rays(cx, cy, s, a, col) {
  g.save(); g.translate(cx, cy); g.rotate(s * .25); g.globalAlpha = a;
  for (let i = 0; i < 18; i++) { g.rotate(Math.PI * 2 / 18); const gr = g.createLinearGradient(0, 0, 0, -1100); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,200,80,0)'); g.fillStyle = gr; g.beginPath(); g.moveTo(-8, 0); g.lineTo(-70 - (i % 2) * 40, -1100); g.lineTo(70 + (i % 2) * 40, -1100); g.lineTo(8, 0); g.fill(); }
  g.restore(); g.globalAlpha = 1;
}
function sparkle(x, y, r, a) { g.save(); g.globalAlpha = a; g.fillStyle = '#fff'; g.translate(x, y); g.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * .22 : r, an = i * Math.PI / 4; g.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); } g.fill(); g.restore(); }
function calendarFlip(cx, cy, s, t0) {
  const k = back((s - t0) / .45); if (k <= 0) return;
  const days = [27, 28, 29, 30], p = clamp((s - t0 - .3) / 1.5) * 3, idx = Math.min(3, Math.floor(p)), fr = p - idx;
  g.save(); g.translate(cx, cy); g.scale(k, k); g.rotate(.05);
  g.fillStyle = 'rgba(0,0,0,.35)'; rr(-150, -160, 320, 360, 22); g.fill();
  g.fillStyle = '#fff'; rr(-160, -175, 320, 360, 22); g.fill(); g.fillStyle = '#d64545'; g.beginPath(); g.roundRect(-160, -175, 320, 86, [22, 22, 0, 0]); g.fill();
  text('10月', 0, -130, 46, '#fff', { bold: 1 });
  text(String(days[idx]), 0, 55, 190, idx === 3 ? '#c0392b' : '#222', { font: EN, weight: 800 });
  if (idx < 3 && fr > .5) { const f = (fr - .5) * 2; g.save(); g.translate(0, -89); g.scale(1, 1 - f); g.fillStyle = '#eee'; g.fillRect(-160, 0, 320, 274); g.restore(); }
  if (idx === 3) { const c = clamp((s - t0 - 1.9) / .5); g.strokeStyle = '#e02020'; g.lineWidth = 12; g.lineCap = 'round'; g.beginPath(); g.ellipse(0, 55, 135, 105, -.15, -1.2, -1.2 + c * 6.7); g.stroke();
    if (c >= 1) text('今日まで！', 0, 235, 54, '#fff', { stroke: '#c0392b', bold: 1, rot: -.04 }); }
  g.restore();
}

// ---------- 消滅の画面 ----------
function glitch(s, a) { for (let i = 0; i < 9; i++) { const k = Math.floor(s * 18) + i; if (rnd(k) > a) continue; const y = rnd(k + 3) * H, h = 8 + rnd(k + 5) * 46, dx = (rnd(k + 7) - .5) * 160;
    g.drawImage(cv, 0, y, W, h, dx, y, W, h); g.fillStyle = `rgba(${rnd(k + 9) > .5 ? '255,40,80' : '40,220,255'},.18)`; g.fillRect(0, y, W, h); } }
function vanish(s) {
  const e = s - 2140.5; ticketLayer(s, true);
  const bgc = g.createLinearGradient(0, 0, 0, H); bgc.addColorStop(0, '#0e1424'); bgc.addColorStop(1, '#1a0b16'); g.fillStyle = bgc; g.fillRect(0, 0, W, H);
  // 格子
  g.strokeStyle = 'rgba(120,150,255,.07)'; g.lineWidth = 2; for (let i = 0; i < 28; i++) { g.beginPath(); g.moveTo(0, i * 72 + (s * 30 % 72)); g.lineTo(W, i * 72 + (s * 30 % 72)); g.stroke(); g.beginPath(); g.moveTo(i * 72, 0); g.lineTo(i * 72, H); g.stroke(); }
  const red = clamp((e - .3) / .6); const vg = g.createRadialGradient(W / 2, 800, 200, W / 2, 800, 1100); vg.addColorStop(0, 'rgba(255,30,60,0)'); vg.addColorStop(1, `rgba(255,30,60,${.42 * red})`); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // 券：粒になって右上へ吹き飛ぶ
  const cx = W / 2, cy = 720, d = clamp((e - .35) / 1.6);
  if (d <= 0) { g.drawImage(tc, cx - 380 * 1.25, cy - 190 * 1.25, 760 * 1.25, 380 * 1.25); }
  else if (d < 1) { const cell = 20, cols = 38, rows = 19;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const id = r * cols + c, st = (c / cols) * .55 + rnd(id) * .2, p = clamp((d - st) / .45); if (p >= 1) continue;
      const q = p * p, dx = q * (500 + rnd(id + 1) * 500), dy = -q * (300 + rnd(id + 2) * 700) + Math.sin(p * 9 + id) * 16 * p;
      g.globalAlpha = 1 - p; const sz = cell * 1.25 * (1 - p * .6);
      g.drawImage(tc, c * cell, r * cell, cell, cell, cx - 475 + c * cell * 1.25 + dx, cy - 237 + r * cell * 1.25 + dy, sz + .6, sz + .6); }
    g.globalAlpha = 1; }
  // 点線の跡
  if (d > .5) { g.globalAlpha = clamp((d - .5) * 2); g.setLineDash([18, 14]); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 5; rr(cx - 400, cy - 181, 800, 362, 30); g.stroke(); g.setLineDash([]);
